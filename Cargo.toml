[package]
name = "auto-qv"
version = "0.1.0"
edition = "2024"
description = "Automates writing with pens such as QvPen in VRChat by driving relative mouse movement"
publish = false

[[bin]]
name = "autoqv"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
indicatif = "0.18.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
thiserror = "2"
time = { version = "0.3.55", features = ["formatting"] }
toml = "1.1.8"
ureq = "3.4.2"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3.27.0"
